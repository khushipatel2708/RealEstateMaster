<div class="container mt-8 custome">
    <div *ngIf="!isEditing" class="profile-container container mt-9">
      <div class="card p-4 shadow-lg rounded">
        <div class="row align-items-center">
          <div class="col-md-4 text-center">
            <div class="position-relative">
              <img 
              [src]="UserDetails?.photoPath ? UserDetails.photoPath : 'assets/images/user.jpg'"
                class="rounded-circle border border-3 color p-cursor"
                width="120" height="120"
                alt="user"
              >
            </div>
          </div>
          <div class="col-md-8">
            <h4 class="fw-bold text-dark">{{ UserDetails.userName }}</h4>
            <p class="text-muted">{{ UserDetails.email }}</p>
          </div>
        </div>
      </div>
  
      <div class="table-responsive mt-3">
        <table class="table table-lg table-hover shadow-sm">
          <tbody>
            <tr>
              <td class="text-dark fw-bold bg-light p-3 fs-5"><i class="bi bi-person-circle me-2"></i> Username:</td>
              <td class="fs-5">{{ UserDetails.userName }}</td>
            </tr>
            <tr>
              <td class="text-dark fw-bold bg-light p-3 fs-5"><i class="bi bi-envelope me-2"></i> Email:</td>
              <td class="fs-5">{{ UserDetails.email }}</td>
            </tr>
            <tr>
              <td class="text-dark fw-bold bg-light p-3 fs-5"><i class="bi bi-geo-alt me-2"></i> State:</td>
              <td class="fs-5">{{ UserDetails.state }}</td>
            </tr>
            <tr>
              <td class="text-dark fw-bold bg-light p-3 fs-5"><i class="bi bi-buildings me-2"></i> City:</td>
              <td class="fs-5">{{ UserDetails.city }}</td>
            </tr>
            <tr>
              <td class="text-dark fw-bold bg-light p-3 fs-5"><i class="bi bi-telephone me-2"></i> Phone:</td>
              <td class="fs-5">{{ UserDetails.phoneNo }}</td>
            </tr>
            <tr>
              <td class="text-dark fw-bold bg-light p-3 fs-5"><i class="bi bi-person-badge me-2"></i> Role:</td>
              <td class="fs-5">{{ UserDetails.role }}</td>
            </tr>
            <tr>
              <td class="text-dark fw-bold bg-light p-3 fs-5"><i class="bi bi-pin-map me-2"></i> Pincode:</td>
              <td class="fs-5">{{ UserDetails.pincode }}</td>
            </tr>
          </tbody>
        </table>
      </div>
  
      <div class="text-end mt-3">
        <button class="btn btn-primary btn-md fs-6" (click)="toggleEditMode()">
          <i class="bi bi-pencil me-2"></i> Update Profile
        </button>
      </div>
    </div>
  
    <!-- Edit Form -->
    <div *ngIf="isEditing" class="profile-form-container card p-4 shadow-lg">
      <h3 class="mb-3 text-primary"><i class="bi bi-person-lines-fill"></i> Edit Profile</h3>
      <form [formGroup]="profileForm" (ngSubmit)="updateProfile()">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group position-relative">
              <label><i class="bi bi-person-circle me-2"></i> Username:</label>
              <input type="text" class="form-control" formControlName="userName">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group position-relative">
              <label><i class="bi bi-envelope me-2"></i> Email:</label>
              <input type="email" class="form-control" formControlName="email">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group position-relative">
              <label><i class="bi bi-geo-alt me-2"></i> State:</label>
              <select formControlName="state" class="custom-select" (change)="onChangeState($event)">
                <option value="">Select State</option>
                <option *ngFor="let state of stateList" [value]="state.id">{{ state.name }}</option>
              </select>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group position-relative">
              <label><i class="bi bi-buildings me-2"></i> City:</label>
              <select formControlName="city" class="custom-select">
                <option value="">Select City</option>
                <option *ngFor="let city of cityList" [value]="city.id">{{ city.name }}</option>
              </select>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group position-relative">
              <label><i class="bi bi-telephone me-2"></i> Phone:</label>
              <input type="text" class="form-control" formControlName="phoneNo">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group position-relative">
              <label><i class="bi bi-person-badge me-2"></i> Role:</label>
              <input type="text" class="form-control" formControlName="role" readonly>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group position-relative">
              <label><i class="bi bi-pin-map me-2"></i> Pincode:</label>
              <input type="text" class="form-control" formControlName="pincode">
            </div>
          </div>
        </div>
        <div class="mt-3 text-end">
          <button type="submit" class="btn btn-success btn-md me-2 fs-6">
            <i class="bi bi-check-circle me-2"></i> Save
          </button>
          <button type="button" class="btn btn-secondary btn-md fs-6" (click)="toggleEditMode()">
            <i class="bi bi-x-circle me-2"></i> Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
