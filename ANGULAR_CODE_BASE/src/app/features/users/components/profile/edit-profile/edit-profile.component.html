<div *ngIf="!isEditing" class="profile-container container">
  <div class="card">
    <div class="row">
      <div class="col-md-4">
        <img 
        [src]="UserDetails?.photoPath ? UserDetails.photoPath : 'assets/images/user.jpg'"
          class="rounded-circle p-cursor"
          width="90" height="90"
          id="userDropdown"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          alt="user"
        >
      </div>
        </div>
  </div>
  <div class="table-responsive">
    <table class="table table-lg table-bordered w-100">
      <tbody>
        <tr>
          <td class="text-dark fw-bold bg-light p-3 fs-5">Username:</td>
          <td class="fs-5">{{ UserDetails.userName }}</td>
        </tr>
        <tr>
          <td class="text-dark fw-bold bg-light p-3 fs-5">Email:</td>
          <td class="fs-5">{{ UserDetails.email }}</td>
        </tr>
        <tr>
          <td class="text-dark fw-bold bg-light p-3 fs-5">State:</td>
          <td class="fs-5">{{ UserDetails.state }}</td>
        </tr>
        <tr>
          <td class="text-dark fw-bold bg-light p-3 fs-5">City:</td>
          <td class="fs-5">{{ UserDetails.city }}</td>
        </tr>
        <tr>
          <td class="text-dark fw-bold bg-light p-3 fs-5">Phone:</td>
          <td class="fs-5">{{ UserDetails.phoneNo }}</td>
        </tr>
        <tr>
          <td class="text-dark fw-bold bg-light p-3 fs-5">Role:</td>
          <td class="fs-5">{{ UserDetails.role }}</td>
        </tr>
        <tr>
          <td class="text-dark fw-bold bg-light p-3 fs-5">Pincode:</td>
          <td class="fs-5">{{ UserDetails.pincode }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="text-end mt-3">
    <button class="btn btn-success btn-md fs-6" (click)="toggleEditMode()">
      <i class="bi bi-pencil me-2 fs-6"></i> Update Profile
    </button>
  </div>
</div>



<!-- Edit Form -->
<div *ngIf="isEditing" class="profile-form-container card p-4 shadow-lg">
  <h3 class="mb-3">Edit Profile</h3>
  <form [formGroup]="profileForm" (ngSubmit)="updateProfile()">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label>Username:</label>
          <input type="text" class="form-control" formControlName="userName">
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label>Email:</label>
          <input type="email" class="form-control" formControlName="email">
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label>State:</label>
          <select formControlName="state" class="custom-select" (change)="onChangeState($event)">
            <option value="">Select State</option>
            <option *ngFor="let state of stateList" [value]="state.id">{{ state.name }}</option>
          </select>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label>City:</label>
          <select formControlName="city" class="custom-select">
            <option value="">Select City</option>
            <option *ngFor="let city of cityList" [value]="city.id">{{ city.name }}</option>
          </select>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label>Phone:</label>
          <input type="text" class="form-control" formControlName="phoneNo">
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label>Role:</label>
          <input type="text" class="form-control" formControlName="role" readonly>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label>Pincode:</label>
          <input type="text" class="form-control" formControlName="pincode">
        </div>
      </div>
    </div>
    <button type="submit" class="btn btn-success btn-sm me-3 fs-6">Save</button>
    <button type="button" class="btn btn-secondary btn-sm fs-6" (click)="toggleEditMode()">Cancel</button>
  </form>
</div>
