<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" [fullScreen]="true">
<div class="clock-spinner">
    <div class="text-white" style="margin-top:120%;">Loading...</div>
  </div>
</ngx-spinner>
<div class="row">
  <div class="col-lg-12 grid-margin stretch-card">
    <div class="card p-4 shadow-lg">
      <div class="card-body">
        <form [formGroup]="form">
          <div class="row align-items-center">
            <!-- Search Input -->
            <div class="col-md-4">
              <div class="form-group">
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="bi bi-search"></i> </span>
                  </div>
                  <input type="text" formControlName="searchText" class="form-control form-control-sm" placeholder="search"
                    aria-label="Username" aria-describedby="basic-addon1">
                </div>
              </div>
            </div>

            <!-- Filter and Cancel Buttons -->
            <div class="col-md-3 mb-4">
              <button type="submit" class="btn btn-sm btn-warning mr-1" (click)="onClick_filter()">
                <i class="bi bi-search me-1"></i>Filter</button>
              <button type="reset" class="btn btn-sm btn-secondary" (click)="onClear_Filter()">
                <i class="bi bi-x-lg me-1 btn-icon-prepend"></i>Cancel</button>
            </div>

            <!-- Add New Button -->
            <div class="col-md-5 text-md-right mb-4">
              <button type="button" class="btn btn-primary btn-sm" (click)="onClick_AddEdit()">
                <i class="fa fa-plus btn-icon-prepend"></i> Add New
              </button>
            </div>
          </div>
        </form>

        <!-- Table -->
        <div class="table-responsive">
          <table class="table table-striped mt-3 align-middle" *ngIf="menuList && menuList.length > 0; else noMenu">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Title</th>
                <th>Icon</th>
                <th>Path</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of menuList; let i = index">
                <td>{{ (page - 1) * pageSize + i + 1 }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.title }}</td>
                <td>
                  <i class="{{ item.icon }} text-primary me-1"></i> {{ item.icon }}
                </td>
                <td>{{ item.path }}</td>
                <td>
                  <a class="text-success me-2" ngbTooltip="Edit" (click)="onClick_AddEdit(item.id)">
                    <i class="bi bi-pencil-square fs-5"></i>
                  </a>
                  <a class="text-danger" ngbTooltip="Delete" (click)="onDelete(item.id)">
                    <i class="bi bi-trash3 fs-5"></i>
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
          <ng-template #noMenu>
            <div class="alert alert-warning text-center mt-3" role="alert">
              <i class="bi bi-exclamation-triangle me-2"></i>
              No menus available. Please add a new menu.
            </div>
          </ng-template>

        </div>

        <!-- Pagination & Page Size -->
        <div class="row mt-3 align-items-center">
          <div class="col-md-10">
            <ngb-pagination 
              [collectionSize]="totalRecord" 
              [(page)]="page" 
              (pageChange)="onClick_PageChange($event)" 
              [pageSize]="pageSize" 
              [maxSize]="10">
            </ngb-pagination>
          </div>
          <div class="col-md-2">
            <select [(ngModel)]="pageSize" (ngModelChange)="onChange_PageSize()" class="form-select rounded-1">
              <option *ngFor="let size of pageSizeList" [value]="size.pageSize">{{ size.name }}</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
