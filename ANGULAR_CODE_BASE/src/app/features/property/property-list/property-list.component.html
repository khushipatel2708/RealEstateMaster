<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" [fullScreen]="true">
  <div class="clock-spinner">
    <div class="text-white" style="margin-top:120%;">Loading...</div>
  </div>
</ngx-spinner>
<div class="container">
  <div class="row">
    <div class="col-12">
      <div class="card-body">
        <form [formGroup]="form">
          <div class="row align-items-center">
            <div class="col-md-2 pr-0">
              <div class="form-group">
                <label for="search">Search:</label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                  </div>
                  <input type="text" formControlName="searchText" id="searchText" placeholder="Search"
                    class="form-control">
                </div>
              </div>
            </div>
            <!-- <div class="col-md-2 pl-1 pr-0">
                <div class="form-group">
                  <label for="city">City:</label>
                  <select id="cityId" formControlName="city" required class="custom-select">
                    <option value="">Select City</option>
                    <option *ngFor="let city of cityList" value="{{city.id}}">{{city.name}}</option>
                  </select>
                </div>
              </div> -->
            <div class="col-md-2 pl-1 pr-0">
              <div class="form-group">
                <label for="city">City:</label>
                <select id="cityId" formControlName="city" required class="custom-select">
                  <option value="">Select City</option>
                  <option *ngFor="let city of cityList" [value]="city.id">{{city.name}}</option>
                </select>
              </div>
            </div>

            <div class="col-md-2 pr-0 pl-1">
              <div class="form-group">
                <label for="type">Type:</label>
                <select id="type" formControlName="type" required class="custom-select">
                  <option value="">Select Type</option>
                  <option *ngFor="let type of propertyTypeList" value="{{type.id}}">{{type.title}}</option>
                </select>
              </div>
            </div>

            <div class="col-md-2 pr-0 pl-1">
              <div class="form-group">
                <label for="status">Property Status:</label>
                <select id="status" formControlName="status" required class="custom-select">
                  <option *ngFor="let status of status" value="{{status.name}}">{{status.name}}</option>
                </select>
              </div>
            </div>
            <div class="col-md-3 d-flex align-items-center mb-2">
              <button type="button" class="btn btn-warning btn-lg shadow-sm fw-bold px-4 py-2 m-1" (click)="onFilter()">
                <i class="bi bi-search fs-6 me-1"></i> Filter
              </button>
              
              <button type="button" class="btn btn-secondary btn-lg shadow-sm fw-bold px-4 py-2 m-1" (click)="onClear_Filter()">
                <i class="bi bi-x-lg"></i> Clear
              </button>
              
              <button type="button" class="btn btn-primary btn-lg shadow-sm fw-bold px-4 py-2 m-1" routerLink="/property/new">
                <i class="fa fa-plus btn-icon-prepend"></i> Add New
              </button>
            </div>
            
          </div>
        </form>
        <table class="table text-center m-0" *ngIf="propertyList?.data?.length > 0; else noproperty">
          <thead>
            <tr class="fw-bold">
              <th>#</th>
              <th>Description</th>
              <th>title</th>
              <th>city</th>
              <th>location</th>
              <th>PropertyFor</th>
              <th>PropertyType</th>
              <!-- <th>status</th> -->
              <th>Action</th>
            </tr>
            <tr *ngFor="let item of propertyList?.data;let i = index;">
              <td>{{ (page - 1) * pageSize + i + 1 }}</td>
              <td>{{item.description}}</td>
              <td>{{item.title}}</td>
              <td>{{item.city}}</td>
              <td>{{item.locality}}</td>
              <td>{{item.propertyFor}}</td>
              <td>{{item.type}}</td>
              <!-- <td>{{item.status}}</td> -->
              <td>
                <a class="info p-0" [routerLink]="'/property/view/' + item.slug">
                  <i class="bi bi-eye text-info font-medium-3 mr-2" ngbTooltip="View"></i>
                </a>
                <a *ngIf="UserDetails.role !== 'builder' || (UserDetails.role === 'builder' && UserDetails.id === item.userId)"
                  class="info p-0" (click)="onAddEdit(item.slug)">
                  <i class="bi bi-pencil-square text-info font-medium-3 mr-2" ngbTooltip="Edit"></i>
                </a>

                <!-- Delete Button: Show only for non-builders OR the builder who added it -->
                <a *ngIf="UserDetails.role !== 'builder' || (UserDetails.role === 'builder' && UserDetails.id === item.userId)"
                  class="danger p-0" (click)="onDelete(item.id)">
                  <i class="bi bi-trash text-danger font-medium-3" ngbTooltip="Delete"></i></a>
              </td>
            </tr>
          </thead>
        </table>
        <ng-template #noproperty>
          <div class="alert alert-warning text-center mt-3" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            No property available. Please add a new property.
          </div>
        </ng-template>
      </div>
      <div class="row mt-2">
        <div class="col-md-10">
          <ngb-pagination [collectionSize]="totalRecord" [(page)]="page" (pageChange)="onClick_PageChange($event)"
            [pageSize]="pageSize" [maxSize]="10">
          </ngb-pagination>
        </div>
        <div class="col-md-2">
          <div class="form-group">
            <select [(ngModel)]="pageSize" (ngModelChange)="onChange_PageSize()" class="form-control">
              <option *ngFor="let size of pageSizeList" [value]="size.pageSize">{{ size.name }}</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
