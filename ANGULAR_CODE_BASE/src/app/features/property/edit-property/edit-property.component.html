<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" [fullScreen]="true">
  <div class="clock-spinner">
    <div class="text-white" style="margin-top:120%;">Loading...</div>
  </div>
</ngx-spinner>
<!-- <button (click)="locationBack()" class="btn btn-secondary btn-sm">Back</button> -->
<div class="row">
  <div class="col-12 text-end">
    <button (click)="locationBack()" class="btn btn-secondary btn-sm text-black">
      <i class="bi bi-arrow-left fs-9 me-2"></i> Back
    </button>
  </div>
</div>

  <button (click)="locationBack()" class="float-left btn btn-secondary btn-sm mt-2 mb-2">Back</button>
  <span>Edit Property-</span>
</h3> -->
<div class="container border-main border-box-manage mt-4">
  <form [formGroup]="form" (ngSubmit)="submitForm()">
    <h4>Property Info- </h4>
    <hr class="hr">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="title" class="label-control">Property Title:</label>
          <input type="text" formControlName="title" class="form-control" id="title"
            placeholder="Enter property's title" required>
          <!-- [(ngModel)]="newPropertyData.title" -->
          <small class="form-text text-muted danger" *ngIf="isSubmittingForm && f.title.invalid">
            <span *ngIf="f.title.errors.required">Title is required.</span>
          </small>
        </div>
      </div>
      <!-- <div class="col-md-6">
        <div class="form-group" *ngIf="UserDetails.role !== 'builder'">
          <label for="">Builder: </label>
          <select name="builder" formControlName="builder" class="custom-select">
              <option value="">Select builder</option>
              <option *ngFor="let user of builderUserList" [value]="user.id">{{ user.fname }}</option>
            </select>
            <small class="form-text text-muted danger" *ngIf="isSubmittingForm && f.builder.invalid">
              <span *ngIf="f.builder.errors.required">Builder is required.</span>
            </small>
        </div>
      </div> -->

      <div class="col-md-6">
        <!-- Builder Dropdown (Visible only when role is NOT 'builder') -->
        <div class="form-group" *ngIf="UserDetails.role !== 'builder'">
          <label for="builder">Builder:</label>
          <select name="builder" formControlName="builder" class="custom-select">
            <option value="">Select builder</option>
            <option *ngFor="let user of builderUserList" [value]="user.id">{{ user.fname }}</option>
          </select>
        </div>

        <!-- Agency Name Input Field (Visible only when role is 'builder') -->
        <div class="form-group" *ngIf="UserDetails.role === 'builder'">
          <label for="agencyName">Agency Name:</label>
          <input type="text" id="agencyName" formControlName="agencyName" class="form-control"
            placeholder="Enter Agency Name" [value]="UserDetails.agencyName">
        </div>
      </div>

    </div>
    <div class="form-group">
      <div class="form-row">
        <div class="col-4">
          <label for=""> Property For: </label> <br>
          <!-- [checked]="propertyDetail.propertyFor == 'sell'" -->
          <label> <input type="radio" formControlName="propertyFor" value="sell" name="propertyFor"> Sell </label>
          &nbsp;
        </div>
        <div class="col-4">
          <label for="type">Property Type:</label>
          <select required id="type" formControlName="type" class="custom-select">
            <option value="">Select Property Type</option>
            <!-- <option *ngFor="let property of propertyTypeList" value="{{property._id}}"
              [selected]="propertyDetail.type['_id']">{{property.title}}</option> -->
            <option *ngFor="let property of propertyTypeList" value="{{property.id}}">{{property.title}}</option>
          </select>
          <small class="form-text text-muted danger" *ngIf="isSubmittingForm && f.type.invalid">
            <span *ngIf="f.type.errors.required">Type is required.</span>
          </small>
        </div>
        <div class="col-2"></div>
        <div class="col-2 ">
          <label class="label-control" for="cornerPlot">Corner Plot?</label>
          <div class="custom-control custom-checkbox">
            <input class="custom-control-input" formControlName="cornerPlot" id="cornerPlot" value="true"
              id="cornerPlot" type="checkbox">
            <label class="custom-control-label" for="cornerPlot">Yes</label>
          </div>
        </div>
      </div>
    </div>
    <h4>Location -</h4>
    <hr class="hr">
    <div class="form-row">
      <div class="form-group col-md-4">
        <label for="state">State:</label>
        <select id="state" formControlName="state" (change)="getCityList($event.target.value)" required
          class="custom-select">
          <option value="">Select State</option>
          <!-- <option *ngFor="let state of stateList" [selected]="propertyDetail.state._id" value="{{state._id}}">
            {{state.name}}</option> -->
          <option *ngFor="let state of stateList" value="{{state.id}}">{{state.name}}</option>
        </select>
        <small class="form-text text-muted danger" *ngIf="isSubmittingForm && f.state.invalid">
          <span *ngIf="f.state.errors.required">State is required.</span>
        </small>
      </div>
      <div class="form-group col-md-4">
        <label for="city">City: <small *ngIf="FetchingCityList"><i
              class="fa fa-refresh fa-spin fa-fw"></i></small></label>
        <select id="city" formControlName="city" required class="custom-select">
          <option value="">Select City</option>
          <option *ngFor="let city of cityList" value="{{city.id}}">{{city.name}}
          </option>
        </select>
        <small class="form-text text-muted danger" *ngIf="isSubmittingForm && f.city.invalid">
          <span *ngIf="f.city.errors.required">City is required.</span>
        </small>
      </div>
      <div class="form-group col-md-4">
        <label for="locality">Locality:</label>
        <input type="text" id="locality" formControlName="locality" required placeholder="Enter locality"
          class="form-control">
        <small class="form-text text-muted danger" *ngIf="isSubmittingForm && f.locality.invalid">
          <span *ngIf="f.locality.errors.required">Locality is required.</span>
        </small>
      </div>
    </div>
    <h4>Other Information -</h4>
    <hr class="hr">
    <div class="row">
      <div class="form-group col-md-12">
        <label for="description">Description: </label>
        <textarea id="description" required formControlName="description" class="form-control" cols="30"
          rows="5"></textarea>
        <small class="form-text text-muted danger" *ngIf="isSubmittingForm && f.description.invalid">
          <span *ngIf="f.description.errors.required">Description is required.</span>
        </small>
      </div>
      <div class="form-group col-md-12">
        <label for="address">Property Complete Address</label>
        <input type="text" required id="address" formControlName="address"
          placeholder="Enter complete Property's Address" class="form-control">
        <small class="form-text text-muted danger" *ngIf="isSubmittingForm && f.address.invalid">
          <span *ngIf="f.address.errors.required">Description is required.</span>
        </small>
      </div>
      <div class="form-group col-md-4">
        <label for="email">Email:</label>
        <input type="text" placeholder="Enter Email" id="email" class="form-control" formControlName="email" required>
        <small class="form-text text-muted danger" *ngIf="isSubmittingForm && f.email.invalid">
          <span *ngIf="f.email.errors.required">Email is required.</span>
        </small>
      </div>
      <div class="form-group col-md-4">
        <label for="phoneNo">Phone Number: </label>
        <input type="text" required id="phoneNo" formControlName="phoneNo" placeholder="Enter Phone Number"
          class="form-control">
        <small class="form-text text-muted danger" *ngIf="isSubmittingForm && f.phoneNo.invalid">
          <span *ngIf="f.phoneNo.errors.required">PhoneNo is required.</span>
        </small>
      </div>
      <div class="form-group col-md-4">
        <label for="pincode">Pincode:</label>
        <input type="text" placeholder="Enter Pincode" formControlName="pincode" required id="pincode"
          class="form-control">
        <small class="form-text text-muted danger" *ngIf="isSubmittingForm && f.pincode.invalid">
          <span *ngIf="f.pincode.errors.required">Pincode is required.</span>
        </small>
      </div>
    </div>
    <div class="text-end">
      <button class="btn btn-primary">Update Property</button>
    </div>
  </form>
</div>
