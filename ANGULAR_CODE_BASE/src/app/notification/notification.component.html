<div class="notification-sidebar" [class.show]="isSidebarOpen">
    <div class="sidebar-header">
        <h5>Notifications</h5>
        <button class="btn-close" (click)="closeSidebar()"></button>
    </div>
    <div class="sidebar-content">
        <ul class="list-group">
            <li class="list-group-item" *ngFor="let notification of notifications">
                {{ notification }}
            </li>
        </ul>
    </div>
</div>
