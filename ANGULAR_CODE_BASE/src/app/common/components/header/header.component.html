<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<header style="margin-bottom: 0px;padding-bottom: 0px;" [class.loggedIn]="isUserLoggedIn">
	<div class="container-fluid">
		<div class="row mt-0">
			<div class="col-md-10 text-end">
				<div class="header-ryt text-right pt-3">
					<div>
						<div class="row">
							<div class="col-md-6">									
									<h3 class="page-title text-start pt-3 fs-4"><i [class]="pageIcon" class="fs-3"></i> {{ pageTitle }}</h3>
							</div>
							<div class="col-md-6">
								<div class="row justify-content-end align-items-center">
									<div class="pl-0 col-md-12">
										<div class="user-image dropdown text-right" *ngIf="isUserLoggedIn">
											<span><span class="text-primary">Welcome</span> {{ currentUser?.userName }} </span>
											<img 
											[src]="currentUser?.photoPath ? currentUser.photoPath : 'assets/images/user.jpg'"
											  class="rounded-circle p-cursor dropdown-toggle"
											  id="userDropdown"
											  data-bs-toggle="dropdown"
											  aria-expanded="false"
											  alt="user"
											>
											<ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
											  <li><a class="dropdown-item" routerLink="/users/dashboard">Dashboard</a></li>
											  <li><a class="dropdown-item" routerLink="/users/profile/edit">Profile</a></li>
											  <li><a class="dropdown-item" (click)="handleLogout()">Logout</a></li>
											</ul>
										  </div>	
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</header>
