<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<header style="margin-bottom: 0px;padding-bottom: 0px;" [class.loggedIn]="isUserLoggedIn">
	<div class="container-fluid">
		<div class="row">
			<div class="col-md-2">
				<a class="navbar-brand brand-logo" href=""><img src="assets/images/logo.jpg" alt="logo" height="70"/></a>
					</div>
			<div class="col-md-10">
				<div class="header-ryt text-right pt-3">
					<button type="button" style="margin-right: 5px;" 
						class="btn btn-outline-primary btn-sm" *ngIf="!isUserLoggedIn">Login </button>
					<button type="button" routerLink="/users/sign-up" 
						class="btn btn-outline-primary btn-sm" *ngIf="!isUserLoggedIn">Register</button>
					<div>
						<div class="user-image dropdown" *ngIf="isUserLoggedIn">
							<span><span class="text-primary">Welcome</span> {{ currentUser?.fName }} </span>
							<img 
							  src="assets/images/user.jpg"
							  class="rounded-circle p-cursor dropdown-toggle"
							  id="userDropdown"
							  data-bs-toggle="dropdown"
							  aria-expanded="false"
							  alt="user"
							>
							
							<ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
							  <li><a class="dropdown-item" routerLink="/users/dashboard">Dashboard</a></li>
							  <li>
								<a class="dropdown-item" routerLink="/admin/dashboard">Admin</a>
							  </li>
							  <li><a class="dropdown-item" routerLink="/users/profile/edit">Profile</a></li>
							  <li><a class="dropdown-item" (click)="handleLogout()">Logout</a></li>
							</ul>
						  </div>						  
					</div>
				</div>
			</div>
		</div>
	</div>
</header>
